Protocol:
  Namespace: ActionRPG::DungeonProtocol
  PacketIdEnum: PacketType
  RegisterFunction: RegisterPackets
  Targets:
    - Root: .
      Header: ActionRPGServer/GameRoomServer/DungeonProtocol.h
      Source: ActionRPGServer/GameRoomServer/DungeonProtocol.cpp
      PrerequisiteHeader: RudpPrerequisites.h
    - Root: ../ActionRPGClient
      Header: ActionRPGClient/ActionRPGClient/Network/DungeonProtocol.h
      Source: ActionRPGClient/ActionRPGClient/Network/DungeonProtocol.cpp
      PrerequisiteHeader: RudpPrerequisites.h

Packet:
  - Type: ReplyPacket
    PacketName: DungeonChallenge
    Items:
      - Type: std::uint64_t
        Name: challenge

  - Type: ReplyPacket
    PacketName: DungeonAuthResult
    Items:
      - Type: std::uint8_t
        Name: succeeded

  - Type: RequestPacket
    PacketName: DungeonWorldRequest
    Items:
      - Type: std::uint32_t
        Name: offset

  - Type: ReplyPacket
    PacketName: DungeonWorldChunk
    Items:
      - Type: std::uint32_t
        Name: totalBytes
      - Type: std::uint32_t
        Name: offset
      - Type: std::string
        Name: payload

  - Type: RequestPacket
    PacketName: DungeonMoveInput
    Items:
      - Type: std::uint32_t
        Name: sequence
      - Type: std::int8_t
        Name: directionX
      - Type: std::int8_t
        Name: directionY
      - Type: std::uint8_t
        Name: running

  - Type: ReplyPacket
    PacketName: DungeonPlayerState
    Items:
      - Type: std::uint32_t
        Name: sequence
      - Type: std::string
        Name: mapId
      - Type: float
        Name: x
      - Type: float
        Name: y

  - Type: RequestPacket
    PacketName: DungeonActionInput
    Items:
      - Type: std::uint16_t
        Name: version
      - Type: std::uint32_t
        Name: sequence
      - Type: std::uint8_t
        Name: action
      - Type: std::uint8_t
        Name: facingLeft
      - Type: std::uint32_t
        Name: mapEpoch
      - Type: std::uint32_t
        Name: moveSequence
      - Type: std::int8_t
        Name: directionX
      - Type: std::int8_t
        Name: directionY
      - Type: std::uint8_t
        Name: running

  - Type: ReplyPacket
    PacketName: DungeonActionResult
    Items:
      - Type: std::uint16_t
        Name: version
      - Type: std::uint32_t
        Name: sequence
      - Type: std::uint8_t
        Name: accepted
      - Type: std::uint64_t
        Name: serverTick

  - Type: RequestPacket
    PacketName: DungeonCombatStateRequest
    Items:
      - Type: std::uint32_t
        Name: snapshotId
      - Type: std::uint32_t
        Name: offset

  - Type: ReplyPacket
    PacketName: DungeonCombatStateChunk
    Items:
      - Type: std::uint32_t
        Name: snapshotId
      - Type: std::uint32_t
        Name: totalBytes
      - Type: std::uint32_t
        Name: offset
      - Type: std::uint8_t
        Name: status
      - Type: std::uint32_t
        Name: retryAfterMs
      - Type: std::string
        Name: payload

  - Type: RequestPacket
    PacketName: DungeonRealtimeRequest
    Items:
      - Type: std::uint16_t
        Name: version
      - Type: std::uint8_t
        Name: enabled
      - Type: std::uint64_t
        Name: challenge

  - Type: ReplyPacket
    PacketName: DungeonRealtimeResult
    Items:
      - Type: std::uint16_t
        Name: version
      - Type: std::uint8_t
        Name: accepted
      - Type: std::uint64_t
        Name: challenge
      - Type: std::uint64_t
        Name: roomId
      - Type: std::uint32_t
        Name: dungeonId
      - Type: std::uint16_t
        Name: tickIntervalMs
      - Type: std::uint16_t
        Name: snapshotIntervalMs

  - Type: ReplyPacket
    PacketName: DungeonRealtimeChunk
    Items:
      - Type: std::uint16_t
        Name: version
      - Type: std::uint64_t
        Name: challenge
      - Type: std::uint64_t
        Name: roomId
      - Type: std::uint32_t
        Name: dungeonId
      - Type: std::uint32_t
        Name: mapEpoch
      - Type: std::uint64_t
        Name: snapshotSequence
      - Type: std::uint64_t
        Name: serverTick
      - Type: std::uint64_t
        Name: serverTimeMs
      - Type: std::string
        Name: mapId
      - Type: std::uint32_t
        Name: totalBytes
      - Type: std::uint32_t
        Name: offset
      - Type: std::uint8_t
        Name: state
      - Type: std::string
        Name: payload

  - Type: RequestPacket
    PacketName: DungeonSkillInput
    Items:
      - Type: std::uint32_t
        Name: sequence
      - Type: std::string
        Name: skillId
      - Type: std::uint8_t
        Name: facingLeft
