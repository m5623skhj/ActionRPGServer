Protocol:
  Format: PlainHeader
  Namespace: TownProtocol
  PacketIdEnum: PacketType
  Targets:
    - Root: .
      Header: ActionRPGServer/TownServer/TownPacket.generated.h
    - Root: ../ActionRPGClient
      Header: ActionRPGClient/ActionRPGClient/Network/TownPacket.generated.h

ExternalTypes:
  - MapInfo
  - Vector2
  - DungeonOption
  - PartyMemberInfo
  - PartyOperationType
  - PartyResultCode
  - PartyDirectoryEntry
  - PartyJoinRequestState

Packet:
  - Type: RequestPacket
    PacketName: EnterTownRequest
    Items:
      - Type: std::string
        Name: playerName
      - Type: std::uint32_t
        Name: characterId

  - Type: ReplyPacket
    PacketName: EnterTownResponse
    Items:
      - Type: std::uint64_t
        Name: playerId
      - Type: std::uint32_t
        Name: characterId
      - Type: MapInfo
        Name: map

  - Type: RequestPacket
    PacketName: MoveInput
    Items:
      - Type: std::uint32_t
        Name: sequence
      - Type: std::int8_t
        Name: directionX
      - Type: std::int8_t
        Name: directionY
      - Type: bool
        Name: running

  - Type: ReplyPacket
    PacketName: PlayerAppear
    Items:
      - Type: std::uint64_t
        Name: playerId
      - Type: std::string
        Name: playerName
      - Type: std::uint32_t
        Name: characterId
      - Type: Vector2
        Name: position
      - Type: Vector2
        Name: velocity

  - Type: ReplyPacket
    PacketName: PlayerMove
    Items:
      - Type: std::uint64_t
        Name: playerId
      - Type: std::uint32_t
        Name: serverTick
      - Type: std::uint32_t
        Name: lastProcessedInput
      - Type: Vector2
        Name: position
      - Type: Vector2
        Name: velocity

  - Type: ReplyPacket
    PacketName: PlayerDisappear
    Items:
      - Type: std::uint64_t
        Name: playerId

  - Type: RequestPacket
    PacketName: ConfirmDungeonJoin
    Items:
      - Type: std::uint64_t
        Name: roomId
      - Type: std::uint64_t
        Name: challenge

  - Type: RequestPacket
    PacketName: EnterDungeonRequest
    Items:
      - Type: std::string
        Name: zoneId
      - Type: std::uint32_t
        Name: dungeonId

  - Type: ReplyPacket
    PacketName: EnterDungeonResponse
    Items:
      - Type: bool
        Name: succeeded
      - Type: std::uint64_t
        Name: roomId
      - Type: std::uint64_t
        Name: combatSeed
      - Type: std::string
        Name: sessionBrokerAddress
      - Type: std::uint16_t
        Name: sessionBrokerPort

  - Type: ReplyPacket
    PacketName: MapChanged
    Items:
      - Type: MapInfo
        Name: map
      - Type: Vector2
        Name: position

  - Type: ReplyPacket
    PacketName: DungeonSelectionOpen
    Items:
      - Type: std::string
        Name: zoneId
      - Type: std::string
        Name: dungeonGroupId
      - Type: std::vector<DungeonOption>
        Name: dungeons

  - Type: RequestPacket
    PacketName: PartyInviteRequest
    Items:
      - Type: std::uint64_t
        Name: targetPlayerId

  - Type: RequestPacket
    PacketName: PartyInviteAnswer
    Items:
      - Type: std::uint64_t
        Name: invitationId
      - Type: bool
        Name: accepted

  - Type: RequestPacket
    PacketName: PartyLeaveRequest
    Items: []

  - Type: RequestPacket
    PacketName: PartyKickRequest
    Items:
      - Type: std::uint64_t
        Name: targetPlayerId

  - Type: ReplyPacket
    PacketName: PartyInvitation
    Items:
      - Type: std::uint64_t
        Name: invitationId
      - Type: std::uint64_t
        Name: inviterPlayerId
      - Type: std::string
        Name: inviterName

  - Type: ReplyPacket
    PacketName: PartySnapshot
    Items:
      - Type: std::uint64_t
        Name: partyId
      - Type: std::uint64_t
        Name: leaderPlayerId
      - Type: std::vector<PartyMemberInfo>
        Name: members
      - Type: std::string
        Name: title
      - Type: bool
        Name: isPublic

  - Type: ReplyPacket
    PacketName: PartyOperationResult
    Items:
      - Type: PartyOperationType
        Name: operation
      - Type: PartyResultCode
        Name: result

  - Type: RequestPacket
    PacketName: PartySettingsRequest
    Items:
      - Type: std::string
        Name: title
      - Type: bool
        Name: isPublic

  - Type: RequestPacket
    PacketName: PartyDirectoryPageRequest
    Items:
      - Type: std::uint32_t
        Name: page

  - Type: RequestPacket
    PacketName: PartyDirectoryUnsubscribe
    Items: []

  - Type: ReplyPacket
    PacketName: PartyDirectoryPage
    Items:
      - Type: std::uint32_t
        Name: page
      - Type: std::uint32_t
        Name: totalPages
      - Type: std::uint32_t
        Name: totalCount
      - Type: std::uint64_t
        Name: revision
      - Type: std::vector<PartyDirectoryEntry>
        Name: parties

  - Type: ReplyPacket
    PacketName: PartyDirectoryChanged
    Items:
      - Type: std::uint64_t
        Name: revision

  - Type: RequestPacket
    PacketName: PartyCreateRequest
    Items:
      - Type: std::string
        Name: title
      - Type: bool
        Name: isPublic

  - Type: RequestPacket
    PacketName: DungeonCompletionRequest
    Items:
      - Type: std::uint64_t
        Name: roomId
      - Type: bool
        Name: retry

  - Type: ReplyPacket
    PacketName: DungeonCompletionResponse
    Items:
      - Type: std::uint64_t
        Name: previousRoomId
      - Type: bool
        Name: succeeded
      - Type: bool
        Name: retry
      - Type: std::uint64_t
        Name: roomId
      - Type: std::uint64_t
        Name: combatSeed
      - Type: std::string
        Name: sessionBrokerAddress
      - Type: std::uint16_t
        Name: sessionBrokerPort

  - Type: RequestPacket
    PacketName: SkillStateRequest
    Items: []

  - Type: RequestPacket
    PacketName: LearnSkillRequest
    Items:
      - Type: std::string
        Name: skillId
      - Type: std::uint32_t
        Name: expectedSkillLevel

  - Type: ReplyPacket
    PacketName: SkillStateResponse
    Items:
      - Type: std::string
        Name: payload

  - Type: RequestPacket
    PacketName: PartyDetailRequest
    Items:
      - Type: std::uint64_t
        Name: partyId

  - Type: ReplyPacket
    PacketName: PartyDetailResponse
    Items:
      - Type: std::uint64_t
        Name: partyId
      - Type: PartyResultCode
        Name: result
      - Type: std::string
        Name: title
      - Type: std::uint64_t
        Name: leaderPlayerId
      - Type: bool
        Name: isPublic
      - Type: bool
        Name: busy
      - Type: std::vector<PartyMemberInfo>
        Name: members

  - Type: RequestPacket
    PacketName: PartyJoinRequest
    Items:
      - Type: std::uint64_t
        Name: partyId

  - Type: RequestPacket
    PacketName: PartyJoinAnswer
    Items:
      - Type: std::uint64_t
        Name: requestId
      - Type: bool
        Name: accepted

  - Type: ReplyPacket
    PacketName: PartyJoinRequestUpdate
    Items:
      - Type: std::uint64_t
        Name: requestId
      - Type: std::uint64_t
        Name: partyId
      - Type: std::uint64_t
        Name: requesterPlayerId
      - Type: std::string
        Name: requesterName
      - Type: PartyJoinRequestState
        Name: state
      - Type: PartyResultCode
        Name: result

  - Type: ReplyPacket
    PacketName: PartyKicked
    Items:
      - Type: std::uint64_t
        Name: partyId
      - Type: std::uint64_t
        Name: leaderPlayerId
