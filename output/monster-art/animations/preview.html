<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>몬스터 모션 미리보기</title>
<style>
:root { color-scheme: light dark; font-family: "Segoe UI", sans-serif; }
body { margin: 24px; background: Canvas; color: CanvasText; }
main { max-width: 1280px; margin: auto; }
h1 { font-size: 22px; font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 16px 0; }
button, select { font: inherit; padding: 8px 12px; }
label { display: inline-flex; gap: 8px; align-items: center; }
input[type=range] { width: min(260px, 60vw); }
.panels { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 20px; }
h2 { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
canvas { width: 100%; height: auto; image-rendering: pixelated; display: block;
 background: repeating-conic-gradient(color-mix(in srgb, CanvasText 5%, Canvas) 0% 25%, Canvas 0% 50%) 0 0 / 24px 24px; }
.frame-label { font-variant-numeric: tabular-nums; margin: 8px 0; }
#load-status { min-height: 20px; }
@media (max-width: 760px) { .panels { grid-template-columns: 1fr; } body { margin: 12px; } }
</style>
</head>
<body>
<main>
<h1>몬스터 모션</h1>
<div class="controls">
<label for="motion">동작
<select id="motion">
<option value="move">이동</option>
<option value="hit">피격</option>
<option value="airborne">에어본</option>
<option value="attack">공격</option>
<option value="death">사망</option>
</select></label>
<button id="play" type="button">일시정지</button>
<button id="replay" type="button">처음부터</button>
<label><input id="guides" type="checkbox" checked>중심·바닥 기준선</label>
<label for="frame">프레임 <input id="frame" type="range" min="1" max="8" value="1"><span id="frame-value">1 / 8</span></label>
</div>
<div class="panels">
<section><h2>녹슨 갑옷병 · 일반</h2><canvas id="normal" width="640" height="500" role="img" aria-label="일반 몬스터 애니메이션">일반 몬스터 동작 미리보기</canvas><p id="normal-frame" class="frame-label"></p></section>
<section><h2>몰락한 성채 수호자 · 보스</h2><canvas id="boss" width="640" height="500" role="img" aria-label="보스 몬스터 애니메이션">보스 몬스터 동작 미리보기</canvas><p id="boss-frame" class="frame-label"></p></section>
</div>
<p id="load-status" role="status"></p>
</main>

<script>
(() => {
  const metadata = JSON.parse(document.getElementById("animation-data").textContent);
  const motionSelect = document.getElementById("motion");
  const playButton = document.getElementById("play");
  const replayButton = document.getElementById("replay");
  const guides = document.getElementById("guides");
  const slider = document.getElementById("frame");
  const sliderValue = document.getElementById("frame-value");
  const loadStatus = document.getElementById("load-status");
  const characters = [
    { id: "rusted_armor_soldier", canvas: document.getElementById("normal"), label: document.getElementById("normal-frame"), height: 200 },
    { id: "fallen_citadel_warden", canvas: document.getElementById("boss"), label: document.getElementById("boss-frame"), height: 330 }
  ];
  const imageCache = new Map();
  const currentFrames = new Map();
  let playing = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  let startedAt = 0;
  let requestId = 0;
  let loadError = false;

  function getMotion(character) {
    return metadata.characters[character.id].motions[motionSelect.value];
  }
  function getImage(file) {
    if (imageCache.has(file)) return imageCache.get(file);
    const image = new Image();
    imageCache.set(file, image);
    image.onload = () => { updateLoading(); drawCurrent(); };
    image.onerror = () => {
      loadError = true;
      loadStatus.textContent = "PNG를 읽을 수 없습니다. 미리보기와 이미지들을 같은 폴더에 두세요.";
    };
    image.src = file;
    return image;
  }
  function updateLoading() {
    if (loadError) return;
    const ready = characters.every(character => {
      const image = getImage(getMotion(character).image);
      return image.complete && image.naturalWidth > 0;
    });
    loadStatus.textContent = ready ? "" : "이미지 불러오는 중…";
  }
  function updatePlayButton() {
    playButton.textContent = playing ? "일시정지" : "재생";
  }
  function drawCurrent() {
    for (const character of characters) {
      const motion = getMotion(character);
      const index = currentFrames.get(character.id) || 0;
      const frame = motion.frames[index];
      const image = getImage(motion.image);
      const canvas = character.canvas;
      const context = canvas.getContext("2d");
      const originX = canvas.width / 2;
      const groundY = 460;
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.imageSmoothingEnabled = false;
      if (guides.checked) {
        context.save();
        context.strokeStyle = matchMedia("(prefers-color-scheme: dark)").matches ? "#777" : "#999";
        context.setLineDash([4, 6]);
        context.beginPath();
        context.moveTo(originX, 0); context.lineTo(originX, canvas.height);
        context.moveTo(0, groundY); context.lineTo(canvas.width, groundY);
        context.stroke(); context.restore();
      }
      if (image.complete && image.naturalWidth > 0) {
        const rect = frame.sourceRect;
        const scale = character.height / motion.standingHeight;
        const airHeights = [0, 30, 55, 25, 0, 0, 0, 0];
        const airHeight = motionSelect.value === "airborne" ? airHeights[index] : 0;
        context.drawImage(image, rect.x, rect.y, rect.width, rect.height,
          originX - frame.pivot.x * scale, groundY - airHeight - frame.pivot.y * scale,
          rect.width * scale, rect.height * scale);
      }
      character.label.textContent = "프레임 " + (index + 1) + " / " + motion.frameCount +
        " · " + motion.fps + " fps";
    }
    const mainMotion = getMotion(characters[0]);
    const mainFrame = currentFrames.get(characters[0].id) || 0;
    slider.max = String(mainMotion.frameCount);
    slider.value = String(mainFrame + 1);
    sliderValue.textContent = (mainFrame + 1) + " / " + mainMotion.frameCount;
  }
  function tick(now) {
    if (!playing) return;
    const elapsed = (now - startedAt) / 1000;
    let finished = true;
    for (const character of characters) {
      const motion = getMotion(character);
      const rawFrame = Math.floor(elapsed * motion.fps);
      const index = motion.loop ? rawFrame % motion.frameCount : Math.min(rawFrame, motion.frameCount - 1);
      currentFrames.set(character.id, index);
      if (motion.loop || rawFrame < motion.frameCount) finished = false;
    }
    drawCurrent();
    if (finished) {
      playing = false;
      updatePlayButton();
    } else requestId = requestAnimationFrame(tick);
  }
  function startFromBeginning() {
    cancelAnimationFrame(requestId);
    for (const character of characters) currentFrames.set(character.id, 0);
    startedAt = performance.now();
    updateLoading(); drawCurrent(); updatePlayButton();
    if (playing) requestId = requestAnimationFrame(tick);
  }
  motionSelect.addEventListener("change", () => {
    loadError = false;
    playing = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    startFromBeginning();
  });
  playButton.addEventListener("click", () => {
    playing = !playing;
    if (playing) startFromBeginning();
    else { cancelAnimationFrame(requestId); updatePlayButton(); }
  });
  replayButton.addEventListener("click", () => { playing = true; startFromBeginning(); });
  slider.addEventListener("input", () => {
    playing = false;
    cancelAnimationFrame(requestId);
    const index = Number(slider.value) - 1;
    for (const character of characters) currentFrames.set(character.id, index);
    updatePlayButton(); drawCurrent();
  });
  guides.addEventListener("change", drawCurrent);
  startFromBeginning();
})();
</script>
</body>
</html>
